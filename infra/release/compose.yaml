# Preparation template. Not deployed; adapters/credentials/content must pass stage 7 first.
name: autoreelz2026-release
x-app-env: &app-env
  AR_DB_HOST: db
  AR_DB_PORT: 5432
  AR_DATABASE_NAME: ${POSTGRES_DB:?}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
  APP_SECRET: ${APP_SECRET:?}
  APP_ORIGIN: https://autoreelz.ru
  STORE_MODE: production
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulation}
  YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
  YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
services:
  edge:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    environment:
      TLS_EMAIL: ${TLS_EMAIL:-}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - edge_data:/data
      - edge_config:/config
    networks: [frontend]
    depends_on: [web]
    restart: unless-stopped
  web:
    image: ${RELEASE_IMAGE:?Use a verified immutable image digest}
    init: true
    mem_limit: 1g
    cpus: 2
    environment:
      <<: *app-env
      CMS_INTERNAL_URL: http://cms:8055
      CMS_UPLOADS_PATH: /cms-uploads
      SEO_INDEXING_ENABLED: ${SEO_INDEXING_ENABLED:-false}
      YML_COMPANY_NAME: ${YML_COMPANY_NAME:-}
    volumes: [uploads:/cms-uploads:ro]
    read_only: true
    tmpfs: [/tmp]
    networks: [frontend, backend]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    image: ${RELEASE_IMAGE:?}
    command: [node, scripts/commerce-worker.ts]
    init: true
    environment: *app-env
    read_only: true
    tmpfs: [/tmp]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, --input-type=module, -e, "import {query,getPool} from './src/server/db.ts';const r=await query(\"SELECT 1 FROM ar_worker_heartbeat WHERE name='commerce' AND last_run_at>now()-interval '60 seconds'\");await getPool().end();process.exit(r.rowCount?0:1);"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped
  db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [database:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  db-init:
    profiles: [bootstrap]
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    entrypoint: [sh, /opt/ar-init.sh]
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      CMS_DB_PASSWORD: ${CMS_DB_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      READ_DB_PASSWORD: ${READ_DB_PASSWORD:?}
    volumes: [../init-db.sh:/opt/ar-init.sh:ro]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  cms:
    image: directus/directus:12.3.1@sha256:8978edf633ae28aa31464bb71c55300c94d8bc771ff3727b5fac485173283869
    environment:
      SECRET: ${DIRECTUS_SECRET:?}
      DB_CLIENT: pg
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?}
      DB_USER: ar_cms
      DB_PASSWORD: ${CMS_DB_PASSWORD:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      PUBLIC_URL: ${CMS_PUBLIC_URL:?Agree the production license binding first}
      SESSION_COOKIE_NAME: autoreelz2026_new_session
      REFRESH_TOKEN_COOKIE_NAME: autoreelz2026_new_refresh
      SESSION_COOKIE_SECURE: 'true'
      SESSION_COOKIE_SAME_SITE: lax
      REFRESH_TOKEN_COOKIE_SECURE: 'true'
      REFRESH_TOKEN_COOKIE_SAME_SITE: lax
      TELEMETRY: 'true'
      CACHE_ENABLED: 'false'
    # Access through a separately approved secure admin connection, never public port 8055.
    ports: ['127.0.0.1:28055:8055']
    volumes: [uploads:/directus/uploads]
    networks: [backend]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8055/server/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
networks:
  frontend: {}
  backend: {}
volumes:
  database: {}
  uploads: {}
  edge_data: {}
  edge_config: {}
