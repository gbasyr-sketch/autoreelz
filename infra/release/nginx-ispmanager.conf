# Only autoreelz.ru. Rootless app gateway is bound to loopback; other vhosts remain unchanged.
map $http_upgrade $autoreelz2026_connection {
    default upgrade;
    '' '';
}

server {
    listen 91.200.150.79:80;
    server_name autoreelz.ru www.autoreelz.ru;
    return 301 https://autoreelz.ru$request_uri;
}

server {
    listen 91.200.150.79:443 ssl http2;
    server_name autoreelz.ru www.autoreelz.ru;
    ssl_certificate /etc/ssl/autoreelz2026/autoreelz-chain.pem;
    ssl_certificate_key /etc/ssl/autoreelz2026/autoreelz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host = www.autoreelz.ru) { return 301 https://autoreelz.ru$request_uri; }
    add_header Strict-Transport-Security 'max-age=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    client_max_body_size 52m;
    location / {
        proxy_pass http://127.0.0.1:14324;
        proxy_http_version 1.1;
        proxy_set_header Host autoreelz.ru;
        proxy_set_header X-Forwarded-Host autoreelz.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $autoreelz2026_connection;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }
}
